  const rectOf = () => { const el = steps[i].sel && $(steps[i].sel); if (!el) return null; const r = el.getBoundingClientRect(); return r.width > 1 && r.height > 1 ? r : null; };

  function placeCard(r, W, H) {

async function playVoice(id, b) {
  try { S.audio?.pause(); } catch {}
  if (S.playing === id) { S.playing = null; $$(".vplay").forEach(x => x.innerHTML = ic("play")); return; }
  b.classList.add("busy");
  try {
    const r = await fetch(`/api/voices/${id}/sample`);
    if (!r.ok) { let d = "That voice couldn't be played."; try { d = (await r.json()).detail || d; } catch {} throw new Error(d); }
    const a = S.audio = new Audio(URL.createObjectURL(await r.blob()));
    S.playing = id; $$(".vplay").forEach(x => x.innerHTML = ic("play")); b.innerHTML = ic("pause");
    a.onended = () => { S.playing = null; b.innerHTML = ic("play"); };
    await a.play();
  } catch (err) { S.playing = null; b.innerHTML = ic("play"); toast(err.message, "bad"); }
  finally { b.classList.remove("busy"); }
}

/* ---------- attachments: nothing starts until Make clips is pressed.

   shows up under another. Links move out of the box into the list as soon as they are recognised. */
const DRAFTS = {};
const draftKey = () => creatorId() ? "c:" + creatorId() : S.view;
const att = () => DRAFTS[draftKey()] ||= {files: [], links: [], note: null, busy: false, queued: false};
const VIDEO_EXT = /\.(mp4|mov|mkv|webm|m4v|ts|flv)$/i;
const fmtLen = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const fmtSize = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.max(1, Math.round(b / 1e6)) + " MB";
const isChannel = u => /^(https?:\/\/)?(www\.)?(twitch\.tv|kick\.com)\/[A-Za-z0-9_]+\/?$/.test(u) || /youtube\.com\/(@[^/]+|channel\/[^/]+)\/?(live|videos|streams)?\/?$/.test(u);
const looksLink = u => /^https?:\/\/([\w-]+\.)*(youtube\.com|youtu\.be|twitch\.tv|kick\.com)\//i.test(u);
const fullLink = u => /[?&]v=[\w-]{11}\b|youtu\.be\/[\w-]{11}\b|\/(shorts|live|embed)\/[\w-]{11}\b|twitch\.tv\/videos\/\d{6,}|clips\.twitch\.tv\/\w|twitch\.tv\/\w+\/clip\/\w|kick\.com\/[\w-]+\/(videos?|clips?)\/[\w-]{6,}/i.test(u);
const batchMax = () => S.status.max_batch || 5;
const batchUsed = A => A.files.length + A.links.filter(l => l.state !== "bad").length;
const newId = () => Math.random().toString(36).slice(2);

function attach(list) {
  const A = att(), max = (S.status.max_upload_mb || 2048) * 1024 * 1024;
  let full = false;
  for (const f of list || []) {
    if (!(f.type.startsWith("video/") || VIDEO_EXT.test(f.name))) { toast(`${f.name} is not a video file.`, "bad"); continue; }
    if (f.size > max) { toast(`${f.name} is over the ${S.status.max_upload_mb} MB limit.`, "bad"); continue; }
    if (A.files.some(x => x.file.name === f.name && x.file.size === f.size)) continue;
    if (batchUsed(A) >= batchMax()) { full = true; continue; }
    A.files.push({id: newId(), file: f, src: URL.createObjectURL(f), dur: 0, state: "ready", pct: 0, err: ""});

}

async function lookUp(u) {
  try { return await api("/api/preview?url=" + encodeURIComponent(u)); }
  catch (e) {
    if (e instanceof TypeError) {           // the request itself dropped (network blip): try once more quietly
      await new Promise(r => setTimeout(r, 800));
      try { return await api("/api/preview?url=" + encodeURIComponent(u)); }
      catch (e2) { throw new Error(e2 instanceof TypeError ? "Couldn't reach PeakCut to check that link. Check your connection and paste it again." : e2.message); }
    }
    throw e;
  }
}

}

// A big file goes in pieces (anything standing in front of the app refuses one huge request), two at a time,
// and a piece that fails is simply sent again. The bar shows the whole file.
async function sendBig(f, who, options) {
  const file = f.file;
  const s = await send("/api/upload/start", {name: file.name, size: file.size, options, creator: who});
  const sent = new Array(s.parts).fill(0);
  const show = () => { f.pct = Math.min(99, Math.round(sent.reduce((a, b) => a + b, 0) / file.size * 100)); drawAtt(); };
  const put = i => new Promise((ok, fail) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/api/upload/${s.id}/${i}`);
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => { sent[i] = e.loaded; show(); };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) { sent[i] = Math.min(s.part, file.size - i * s.part); show(); return ok(); }
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      const err = new Error(typeof d === "string" ? d : "Upload failed"); err.final = x.status >= 400 && x.status < 500 && x.status !== 408 && x.status !== 429; fail(err);
    };
    x.onerror = x.ontimeout = () => fail(new Error("Upload failed. Check your connection."));
    x.send(file.slice(i * s.part, Math.min(file.size, (i + 1) * s.part)));
  });
  let next = 0;
  const worker = async () => {
    while (next < s.parts) {
      const i = next++;
      for (let tries = 0; ; tries++) {
        try { await put(i); break; }
        catch (e) { sent[i] = 0; if (e.final || tries >= 3) throw e; await new Promise(r => setTimeout(r, 1500 * (tries + 1))); }
      }
    }
  };
  try {
    await Promise.all([worker(), worker()]);
    await send(`/api/upload/${s.id}/finish`, {});
    f.pct = 100; drawAtt();
  } catch (e) {
    next = s.parts;                                   // stop the other sender
    api(`/api/upload/${s.id}`, {method: "DELETE"}).catch(() => {});
    throw e;
  }
}
function sendFile(f, who, options) {
  if (S.status.upload_part_mb && f.file.size > S.status.upload_part_mb * 1048576) return sendBig(f, who, options);
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest(), fd = new FormData();
    fd.append("file", f.file); fd.append("options", JSON.stringify(options)); fd.append("creator", who);
    x.open("POST", "/api/upload");
    x.upload.onprogress = e => { if (e.lengthComputable) { f.pct = Math.round(e.loaded / e.total * 100); drawAtt(); } };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) return ok();

async function makeClips() {
  const A = att();
  if (A.busy) return;
  const typed = $("#url")?.value.trim();
  if (typed && looksLink(typed) && !isChannel(typed)) { clearTimeout(linkTimer); takeLink(A, typed, $("#url")); }
  const waiting = A.links.some(l => l.state === "wait");
  if (!waiting && !canGo(A)) {
    toast(A.note || "Paste a YouTube, Twitch or Kick video link, or add a video file first.", "bad");
    $("#url")?.focus();
    return;
  }
  if (!A.look) {        // not yet asked for these videos (a link still being found keeps the answer until it starts)
    const look = await askLook();
    if (!look || A.busy) return;
    A.look = look;
  }
  if (A.links.some(l => l.state === "wait")) {   // still looking a link up: start as soon as it is found
    A.queued = true; drawAtt();
    toast("Finding the video first. Clipping starts as soon as it's found.");
    return;
  }
  if (!canGo(A)) {
    A.look = null;
    toast(A.note || "Paste a YouTube, Twitch or Kick video link, or add a video file first.", "bad");
    $("#url")?.focus();
    return;
  }
  const lang = $("#o_lang")?.value || "en", sp = speechLangs()[lang];
  if (sp && sp.state === "missing" && A.langOk !== lang) return langNote(A, lang);
  $("#langnote")?.remove();
  A.busy = true; drawAtt();
  let started = 0, failed = 0;
  const who = targetCreator(), opts = {...jobOptions(), ...A.look};
  A.look = null;
  for (const l of A.links.filter(x => x.state === "ok")) {
    l.sending = true; drawAtt();
    try { await send("/api/jobs", {url: l.url, options: opts, creator: who}); l.state = "done"; started++; }
    catch (e) { l.state = "bad"; l.msg = e.message; failed++; }
    l.sending = false; drawAtt();
  }
  for (const f of A.files) {
    f.state = "up"; f.pct = 0; drawAtt();
    try { await sendFile(f, who, opts); f.state = "done"; started++; }
    catch (e) { f.state = "error"; f.err = e.message; failed++; }
    drawAtt();
  }
  A.links = A.links.filter(l => l.state !== "done");
  A.files = A.files.filter(f => { if (f.state === "done") { URL.revokeObjectURL(f.src); return false; } return true; });
  A.busy = false; drawAtt();
  if (started) {
    toast(`${started === 1 ? "Your video is" : started + " videos are"} being clipped now.`, "ok");
    if (!failed && S.view === "overview") go(who ? "c:" + who : "library"); else tick();
  } else if (failed) toast("Nothing was started. The reason is shown on the video.", "bad");
}

function scoreCls(s) { return s >= 80 ? "s-hi" : s >= 60 ? "s-mid" : ""; }
function postPills(c) {

    return p.url ? `<a class="pill ${cls}" href="${esc(p.url)}" target="_blank" rel="noopener">${txt}</a>` : `<span class="pill ${cls}" title="${esc(p.error || "")}">${txt}</span>`;
  }).join("");

function localDateKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function getAccountNextSlot(acc, cr, takenSet, perDayMap, startFrom) {
  const times = (acc.schedule && acc.schedule.times) || [];
  const ahead = !!(acc.schedule && acc.schedule.ahead);
  const nowSec = startFrom || (Date.now() / 1000);
  const minStart = ahead ? (nowSec + 600) : nowSec;

  const taken = takenSet || new Set();
  const perDay = perDayMap || {};

  if (times.length > 0) {
    const cap = times.length;
    const d = new Date(minStart * 1000);
    const startY = d.getFullYear(), startM = d.getMonth(), startD = d.getDate();
    for (let dayOffset = 0; dayOffset <= 60; dayOffset++) {
      for (const hhmm of times) {
        const h = parseInt(hhmm.slice(0, 2), 10);
        const m = parseInt(hhmm.slice(3, 5), 10);
        const slotD = new Date(startY, startM, startD + dayOffset, h, m, 0, 0);
        const t = Math.floor(slotD.getTime() / 1000);
        if (t > minStart) {
          const dk = localDateKey(slotD);
          const minKey = Math.floor(t / 60);
          if (!taken.has(minKey) && (perDay[dk] || 0) < cap) {
            return t;
          }
        }
      }
    }
  }

  const gapMin = (cr && cr.post_gap_min) || 45;
  const cap = (cr && cr.daily_cap) || 8;
  let maxTaken = nowSec;
  for (const m of taken) {
    if (m * 60 > maxTaken) maxTaken = m * 60;
  }
  let t = Math.max(nowSec, maxTaken + gapMin * 60);
  for (let i = 0; i < 30; i++) {
    const d = new Date(t * 1000);
    const dk = localDateKey(d);
    if ((perDay[dk] || 0) < cap) {
      return t;
    }
    const nextDay = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 9, 0, 0, 0);
    t = Math.floor(nextDay.getTime() / 1000);
  }
  return t;
}

function getProjectedSlots() {
  const map = {};
  if (!S.accounts || !S.accounts.length || !S.jobs) return map;

  const accTaken = {};
  const accPerDay = {};

  for (const a of S.accounts) {
    accTaken[a.id] = new Set();
    accPerDay[a.id] = {};
  }

  for (const j of S.jobs) {
    for (const c of (j.clips || [])) {
      for (const p of Object.values(c.posts || {})) {
        if (p.status !== "cancelled" && p.status !== "failed") {
          const t = p.publish_at || p.due_at;
          if (t) {
            const acc = S.accounts.find(a => a.id === p.account || a.name === p.account_name) || S.accounts[0];
            if (acc && accTaken[acc.id]) {
              accTaken[acc.id].add(Math.floor(t / 60));
              const dk = localDateKey(new Date(t * 1000));
              accPerDay[acc.id][dk] = (accPerDay[acc.id][dk] || 0) + 1;
            }
          }
        }
      }
    }
  }

  function targetAccountForJob(j) {
    for (const c of (j.clips || [])) {
      for (const p of Object.values(c.posts || {})) {
        if (p.status !== "cancelled" && p.status !== "failed") {
          const acc = S.accounts.find(a => a.id === p.account || a.name === p.account_name);
          if (acc) return acc;
        }
      }
    }
    if (j.creator) {
      const cr = (S.creators || []).find(x => x.id === j.creator);
      if (cr) {
        if (cr.accounts && cr.accounts.length) {
          const acc = S.accounts.find(a => cr.accounts.includes(a.id));
          if (acc) return acc;
        }
        const byName = S.accounts.find(a => a.name.toLowerCase() === cr.name.toLowerCase());
        if (byName) return byName;
      }
    }
    return S.accounts[0];
  }

  for (const j of S.jobs) {
    const acc = targetAccountForJob(j);
    if (!acc) continue;
    const cr = (S.creators || []).find(x => x.id === j.creator);
    for (const c of (j.clips || [])) {
      if (c.status !== "done") continue;
      const hasPost = Object.values(c.posts || {}).some(p => p.status !== "cancelled" && p.status !== "failed");
      if (hasPost) continue;

      const slot = getAccountNextSlot(acc, cr, accTaken[acc.id], accPerDay[acc.id]);
      if (slot) {
        accTaken[acc.id].add(Math.floor(slot / 60));
        const dk = localDateKey(new Date(slot * 1000));
        accPerDay[acc.id][dk] = (accPerDay[acc.id][dk] || 0) + 1;
        map[`${j.id}:${c.id}`] = {
          time: slot,
          account_id: acc.id,
          account_name: acc.name
        };
      }
    }
  }

  return map;
}

function barChart(daily) {
  const W = 720, H = 230, pl = 30, pb = 28, pt = 12, n = daily.length, ch = H - pt - pb;
  const peak = Math.max(1, ...daily.map(d => Math.max(d.clips, d.posted)));
  const step = Math.max(1, Math.ceil(peak / 4)), top = step * 4, cw = (W - pl) / n, bw = Math.min(14, (cw - 10) / 2);
  const y = v => pt + ch * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 4; i++) g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}"/><text x="${pl - 8}" y="${y(i * step) + 4}" text-anchor="end">${i * step}</text>`;
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], {day:"numeric", month:"short"});
    g += `<g><title>${lab}: ${d.clips} clips made, ${d.posted} posted${d.views ? ", " + d.views.toLocaleString() + " views" : ""}</title>
      <rect class="b1" x="${cx - bw - 1}" y="${y(d.clips)}" width="${bw}" height="${Math.max(0, ch * d.clips / top)}" rx="3"/>
      <rect class="b2" x="${cx + 1}" y="${y(d.posted)}" width="${bw}" height="${Math.max(0, ch * d.posted / top)}" rx="3"/>
      <rect x="${pl + i * cw}" y="${pt}" width="${cw}" height="${ch}" fill="transparent"/></g>`;
    if (i % 2 === (n - 1) % 2) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
  });
  const none = daily.every(d => !d.clips && !d.posted) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No clips in the last 14 days yet</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Clips made and posted per day, last 14 days">${g}${none}</svg>`;
}

async function loadUsage() {

  S.status.ai = {...S.status.ai, ready: S.usage.ready, provider: S.usage.provider, model: S.usage.model, today_calls: S.usage.today_calls, today_tokens: S.usage.today_tokens};
  drawShell(); drawUsage();

function tokenChart(daily) {
  const W = 1000, H = 220, pl = 64, pb = 26, pt = 10, n = daily.length, ch = H - pt - pb;
  const peak = Math.max(...daily.map(d => d.tokens), 1), top = peak * 1.15, cw = (W - pl) / n, bw = Math.min(14, cw - 6);
  const y = v => pt + ch * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = top * i / 3; g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmtK(Math.round(v))}</text>`; }
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], {day:"numeric", month:"short"});
    g += `<g><title>${lab}: ${d.tokens.toLocaleString()} tokens in ${d.calls} call${d.calls === 1 ? "" : "s"}</title><rect class="b1" x="${cx - bw / 2}" y="${y(d.tokens)}" width="${bw}" height="${Math.max(0, ch * d.tokens / top)}" rx="3"/></g>`;
    if ((n - 1 - i) % 5 === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
  });
  const none = daily.every(d => !d.tokens) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No AI used in the last 30 days</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="AI tokens used per day, last 30 days">${g}${none}</svg>`;
}
function hbars(rows) {
  const total = rows.reduce((a, r) => a + r[1], 0) || 1;
  return rows.length ? `<div class="hbar">${rows.map(r => `<div class="hbar-row"><div class="top"><span>${esc(r[0])}</span><span>${fmtK(r[1])} tokens · ${r[2]} call${r[2] === 1 ? "" : "s"}</span></div>
    <div class="track"><i style="width:${Math.max(2, r[1] / total * 100)}%"></i></div></div>`).join("")}</div>` : `<p class="help">Nothing yet.</p>`;
}
function drawUsage() {
  const k = S.usage, box = $("#usage"); if (!k || !box) return;
  box.innerHTML = `${k.ready ? "" : `<div class="note">${ic("warn")}<span>${S.status.user?.is_admin ? "No AI key is set, so clips are picked by loudness only. Add your key under Settings, AI." : "The AI isn't set up on this server yet, so clips are picked by loudness."}</span></div>`}
    <div class="tiles five" style="margin-top:${k.ready ? 0 : 16}px">

function dayWhen(t) {

// a channel's (or a whole group's) upload times. Resolves to {on, times, ahead} or null.
function timesDialog(o) {
  return new Promise(res => {
    const d = $("#formdlg");
    let times = [...(o.times || [])];
    d.innerHTML = `<form method="dialog" class="dlg wide"><h2>${esc(o.title)}</h2><p class="help">${esc(o.text)}</p>
      <label class="sw"><input type="checkbox" id="td_on" ${o.on ? "checked" : ""}><span>Upload at set times each day<small>Off: clips go out after the gap set on each creator.</small></span></label>
      <div class="td-body" id="td_body">
        <div class="quickfill"><span class="sub">Quick fill</span>
          <label class="f">Videos a day<input id="td_n" type="number" min="1" max="12" value="${times.length || 6}"></label>
          <label class="f">First at<input id="td_from" type="time" value="${esc(times[0] || "08:00")}"></label>
          <label class="f">Then every<select id="td_gap">${opts({30:"30 minutes", 60:"1 hour", 90:"1½ hours", 120:"2 hours", 180:"3 hours", 240:"4 hours"}, 60)}</select></label>
          <button type="button" class="btn" id="td_fill">Fill in</button></div>
        <div><span class="flabel">Upload times (this computer's clock)</span><div class="tchips edit" id="td_list"></div></div>
        <div class="row"><input type="time" id="td_add" value="12:00" class="timein" aria-label="Time to add"><button type="button" class="btn sm" id="td_addbtn">${ic("plus")}Add time</button></div>
        ${o.yt ? `<fieldset class="radios"><legend>How YouTube clips go out</legend>
          <label class="rd"><input type="radio" name="td_mode" value="ahead" ${o.ahead !== false ? "checked" : ""}><span><b>YouTube publishes them (recommended)</b><small>Each clip is uploaded up to a day early as a scheduled video, and YouTube makes it public at its time, even if this computer is off by then.</small></span></label>
          <label class="rd"><input type="radio" name="td_mode" value="local" ${o.ahead === false ? "checked" : ""}><span><b>PeakCut posts at the time</b><small>The clip is uploaded at its time. This computer must be on, with PeakCut running.</small></span></label></fieldset>` : ""}
      </div>${o.extra || ""}
      <div class="dlg-foot"><button class="btn" value="no">Cancel</button><button class="btn primary" value="yes">${ic("check")}Save</button></div></form>`;
    const draw = () => {
      times = [...new Set(times)].sort();
      $("#td_list").innerHTML = times.length ? times.map(t => `<span class="tchip">${esc(t)}<button type="button" data-rm="${esc(t)}" aria-label="Remove ${esc(t)}">${ic("x")}</button></span>`).join("")
        : `<span class="sub">No times yet. Use Quick fill, or add them one by one.</span>`;
      $("#td_body").classList.toggle("off", !$("#td_on").checked);
    };
    $("#td_list").onclick = e => { const b = e.target.closest("[data-rm]"); if (b) { times = times.filter(t => t !== b.dataset.rm); draw(); } };
    $("#td_addbtn").onclick = () => {
      const v = $("#td_add").value;
      if (times.length >= 12) return toast("At most 12 upload times a day.", "bad");
      if (v) { times.push(v); draw(); }
    };
    $("#td_fill").onclick = () => {
      const n = Math.max(1, Math.min(12, Number($("#td_n").value) || 1)), gap = Number($("#td_gap").value);
      const [h, m] = ($("#td_from").value || "08:00").split(":").map(Number), out = [];
      for (let i = 0; i < n && h * 60 + m + i * gap < 1440; i++) {
        const t = h * 60 + m + i * gap;
        out.push(`${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`);
      }
      times = out; draw();
      if (out.length < n) toast(`Only ${out.length} fit before midnight.`);
    };
    $("#td_on").onchange = draw;
    draw();
    d.onclose = () => {
      if (d.returnValue !== "yes") return res(null);
      res({on: $("#td_on").checked, times, ...(o.yt ? {ahead: $("input[name=td_mode]:checked")?.value !== "local"} : {})});
    };
    d.returnValue = "no"; d.showModal();
  });
}

async function channelAction(a, d) {
  if (a === "chplan") {
    if (d.creator) {
      const c = S.creators.find(x => x.id === d.creator);
      if (!c?.accounts?.some(id => S.accounts.some(x => x.id === id))) { toast("Pick which channels this creator posts to first.", "bad"); return go("c:" + d.creator, "setup"); }
      return planDialog({creator: d.creator});
    }
    return planDialog(d.all ? {all: true} : d.group ? {group: d.group} : {accounts: [d.id]});
  }
  if (a === "chedit") return editChannel(d.id);
  if (a === "chhow") return connectGuide();
  if (a === "gnew") {
    const r = await groupDialog("New group", "", true); if (!r) return;
    await send("/api/groups", r); toast(`Group "${r.name}" made`, "ok"); return refreshPosting();
  }
  const g = (S.groups || []).find(x => x.id === d.id); if (!g) return;
  if (a === "grename") {
    const r = await groupDialog("Rename group", g.name); if (!r) return;
    await send(`/api/groups/${g.id}`, {name: r.name}, "PUT"); return refreshPosting();
  }
  if (a === "gdelete") {
    if (!await ask(`Delete the group "${g.name}"?`, "Its channels stay connected, with their times. They just won't be in a group.", "Delete group", true)) return;
    await api(`/api/groups/${g.id}`, {method: "DELETE"}); return refreshPosting();
  }
  if (a === "gtimes") {
    const members = (S.chan?.channels || []).filter(x => x.group === g.id), first = members.find(x => x.schedule.own) || members[0];
    const r = await timesDialog({title: `Same times for all of ${g.name}`, text: `All ${plural(members.length, "channel")} in this group get these upload times. Clips waiting for them move onto the new times.`,
                                 on: true, times: first?.schedule.times || [], yt: members.some(x => x.platform === "youtube"), ahead: first?.schedule.ahead});
    if (!r) return;
    const x = await send(`/api/groups/${g.id}`, {schedule_on: r.on, times: r.times, ...(r.ahead === undefined ? {} : {ahead: r.ahead})}, "PUT");
    toast(x.moved ? `Saved. ${plural(x.moved, "waiting clip")} moved onto the new times.` : "Saved", "ok"); return refreshPosting();
  }
}

function initTimeline(j, c) {
  const box = $("#tl_box");
  if (!box) return;
  const viewport = $("#tl_viewport");
  const track = $("#tl_track");
  const ticks = $("#tl_ticks");
  const clipsTrack = $("#tl_clips_track");
  const hLeft = $("#tl_h_left");
  const hRight = $("#tl_h_right");
  const pointer = $("#tl_pointer");
  const pointerCap = $("#tl_pointer_cap");
  const needleBadge = $("#tl_needle_badge");
  const progFill = $("#tl_prog");
  const dimL = $("#tl_dim_l");
  const dimR = $("#tl_dim_r");
  const durLbl = $("#tl_dur");
  const startLbl = $("#tl_start_lbl");
  const endLbl = $("#tl_end_lbl");
  const inStart = $("#tl_in_start");
  const inEnd = $("#tl_in_end");
  const stageVideo = $("#stage_video");
  const sourceVideo = $("#source_video");
  const stageBadge = $("#stage_badge");
  const stageToggleBtn = $("#stage_toggle_btn");
  const zVal = $("#tl_z_val");
  const zIn = $("#tl_z_in");
  const zOut = $("#tl_z_out");
  const zFit = $("#tl_z_fit");
  const playBtn = $("#tl_play_btn");

  const totalDur = Math.max(Number(j.duration) || 0, c.src_end || 0, c.end || 0, 60);
  const minTime = c.src_offset != null ? c.src_offset : 0;
  const maxTime = c.src_end != null ? c.src_end : totalDur;
  const span = Math.max(1, maxTime - minTime);

  let start = Math.max(minTime, Math.min(maxTime - 3, Number(inStart?.value) || c.start));
  let end = Math.min(maxTime, Math.max(start + 3, Number(inEnd?.value) || c.end));
  let pointerTime = start;
  let mode = stageVideo ? "rendered" : "source";
  let isReview = mode === "source";
  let isLoop = true;
  let dragType = null;
  let startX = 0;
  let initStart = 0;
  let initEnd = 0;
  let zoom = 1.0;

  function getActiveVideo() {
    return (mode === "rendered" && stageVideo) ? stageVideo : (sourceVideo || stageVideo);
  }

  if (sourceVideo) {
    const onMeta = () => {
      sourceVideo.currentTime = start;
    };
    if (sourceVideo.readyState >= 1) onMeta();
    else sourceVideo.addEventListener("loadedmetadata", onMeta, { once: true });
  }

  function syncPlayBtn() {
    if (!playBtn) return;
    const v = getActiveVideo();
    const isPlaying = v && !v.paused && !v.ended;
    playBtn.innerHTML = isPlaying ? ic("pause") : ic("play_f");
    playBtn.title = isPlaying ? "Pause (Space)" : "Play (Space)";
    playBtn.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
  }

  function togglePlay() {
    const v = getActiveVideo();
    if (!v) return;
    if (v.paused) {
      if (mode === "source") {
        if (v.currentTime >= end || v.currentTime < start) {
          const firstKept = segments.find(s => !s.deleted);
          v.currentTime = firstKept ? firstKept.start : start;
        }
      } else {
        const clipDur = (v.duration && isFinite(v.duration)) ? v.duration : Math.max(0.1, end - start);
        if (v.currentTime >= clipDur - 0.05 || v.ended) {
          v.currentTime = 0;
        }
      }
      if (currentSpeed > 0) {
        v.playbackRate = currentSpeed;
        v.play().catch(() => {});
      } else {
        setSpeed(currentSpeed);
      }
    } else {
      v.pause();
      if (reverseTimer) { cancelAnimationFrame(reverseTimer); reverseTimer = null; }
    }
    syncPlayBtn();
  }

  if (playBtn) playBtn.onclick = togglePlay;

  // Video Speed Controller (-2x, -1x, 0.5x, 0.75x, 1x, 1.25x, 1.5x, 2x)
  const speedSelect = $("#clip_speed_select");
  const speedPills = document.querySelectorAll(".speed-pill");
  let currentSpeed = Number(c.speed) || 1.0;
  let reverseTimer = null;

  // Multi-trim & Cut Segments State
  let segments = [];
  let nextSegId = 1;
  const inSegments = $("#tl_in_segments");
  const segListWrap = $("#tl_seg_list");
  const splitBtn = $("#tl_split_btn");
  const splitTLbl = $("#tl_split_t_lbl");
  const resetCutsBtn = $("#tl_reset_cuts_btn");
  const keptLbl = $("#tl_kept_lbl");

  let parsedSegs = null;
  try {
    if (inSegments?.value) parsedSegs = JSON.parse(inSegments.value);
  } catch {}
  if (!parsedSegs && Array.isArray(c.segments)) parsedSegs = c.segments;

  if (Array.isArray(parsedSegs) && parsedSegs.length > 1) {
    let prevE = null;
    parsedSegs.forEach(pair => {
      const s0 = Math.round(Number(pair[0]) * 100) / 100;
      const s1 = Math.round(Number(pair[1]) * 100) / 100;
      if (prevE != null && s0 > prevE + 0.1) {
        segments.push({ id: nextSegId++, start: prevE, end: s0, deleted: true });
      }
      segments.push({ id: nextSegId++, start: s0, end: s1, deleted: false });
      prevE = s1;
    });
  } else {
    segments = [{ id: nextSegId++, start: start, end: end, deleted: false }];
  }

  function renderSegments() {
    if (clipsTrack) {
      let html = "";
      let partNum = 1;
      segments.forEach((s, idx) => {
        const lPct = toPct(s.start);
        const rPct = toPct(s.end);
        const wPct = Math.max(0, rPct - lPct);
        const dur = Math.max(0, s.end - s.start);
        const isDel = s.deleted;
        const cls = isDel ? "deleted" : "active";

        html += `<div class="tl-video-card ${cls}" data-seg-id="${s.id}" style="left:${lPct}%;width:${wPct}%;" title="${isDel ? 'Cut out' : 'Video ' + partNum}: ${fmt(s.start)}–${fmt(s.end)} (${dur.toFixed(1)}s)">
          <div class="tl-vcard-top">
            <span class="tl-vcard-title ${isDel ? 'cut' : ''}">
              ${isDel ? `<strike>Cut (${dur.toFixed(1)}s)</strike>` : `🎬 <b>Video ${partNum}</b>`}
            </span>
            ${isDel 
              ? `<button type="button" class="tl-vcard-res" data-act-res="${s.id}" title="Restore this video">↺</button>` 
              : `<button type="button" class="tl-vcard-del" data-act-del="${s.id}" title="Delete this video">✕</button>`}
          </div>
          <div class="tl-vcard-bot">
            <span class="tl-vcard-dur">${dur.toFixed(1)}s</span>
            <span class="tl-vcard-range">${fmt(s.start)}–${fmt(s.end)}</span>
          </div>
        </div>`;

        if (idx > 0) {
          html += `<div class="tl-split-seam" style="left:${lPct}%;" title="Split point: ${fmt(s.start)}">
            <span class="tl-seam-badge">✂</span>
          </div>`;
        }
        if (!isDel) partNum++;
      });
      clipsTrack.innerHTML = html;
    }

    if (segListWrap) {
      const cutCount = segments.filter(s => s.deleted).length;
      if (segments.length > 1 || cutCount > 0) {
        let listHtml = "";
        let partNum = 1;
        segments.forEach((s) => {
          const dur = Math.max(0, s.end - s.start);
          if (s.deleted) {
            listHtml += `<div class="tl-seg-item deleted" data-seg-id="${s.id}" title="Click to seek to this cut part">
              <div class="tl-seg-info">
                <span class="tl-seg-name cut">✂ Cut Part:</span>
                <span class="tl-seg-range"><strike>${fmt(s.start)} – ${fmt(s.end)}</strike></span>
                <span class="tl-seg-dur">(${dur.toFixed(1)}s)</span>
              </div>
              <div class="tl-seg-actions">
                <button type="button" class="seg-res" data-act-res="${s.id}" title="Restore this cut video">↺ Restore</button>
              </div>
            </div>`;
          } else {
            listHtml += `<div class="tl-seg-item" data-seg-id="${s.id}" title="Click to seek to this video part">
              <div class="tl-seg-info">
                <span class="tl-seg-name">🎬 Video ${partNum++}:</span>
                <span class="tl-seg-range">${fmt(s.start)} – ${fmt(s.end)}</span>
                <span class="tl-seg-dur">(${dur.toFixed(1)}s)</span>
              </div>
              <div class="tl-seg-actions">
                <button type="button" class="seg-del" data-act-del="${s.id}" title="Delete this video from clip">✕ Delete</button>
              </div>
            </div>`;
          }
        });
        segListWrap.innerHTML = listHtml;
        segListWrap.style.display = "flex";
      } else {
        segListWrap.innerHTML = "";
        segListWrap.style.display = "none";
      }
    }

    const keptSegs = segments.filter(s => !s.deleted);
    const keptDur = keptSegs.reduce((acc, s) => acc + (s.end - s.start), 0);
    const cutCount = segments.filter(s => s.deleted).length;
    if (durLbl) {
      durLbl.textContent = `${keptDur.toFixed(1)}s`;
    }
    if (keptLbl) {
      keptLbl.innerHTML = cutCount > 0 
        ? `Kept: <b>${keptDur.toFixed(1)}s</b> (${cutCount} cut)` 
        : `Kept: <b>${keptDur.toFixed(1)}s</b>`;
    }
    if (resetCutsBtn) {
      const hasCuts = segments.length > 1 || cutCount > 0;
      resetCutsBtn.disabled = !hasCuts;
      resetCutsBtn.title = hasCuts ? "Clear all cuts and restore full range" : "No cuts to reset";
    }
    if (inSegments) {
      inSegments.value = cutCount > 0 ? JSON.stringify(keptSegs.map(s => [Math.round(s.start * 100) / 100, Math.round(s.end * 100) / 100])) : "";
    }
  }

  function splitAt(t) {
    t = Math.round(t * 100) / 100;
    const target = segments.find(s => !s.deleted && t >= s.start + 0.25 && t <= s.end - 0.25);
    if (!target) {
      toast("Move the pointer line inside a video (at least 0.25s from its ends) to split", "bad");
      return;
    }
    const idx = segments.indexOf(target);
    const s1 = { id: nextSegId++, start: target.start, end: t, deleted: false };
    const s2 = { id: nextSegId++, start: t, end: target.end, deleted: false };
    segments.splice(idx, 1, s1, s2);
    renderSegments();
    updateVisuals(t);
    toast(`Split video into two parts at ${fmt(t)}! Move the pointer line to split again anytime.`, "ok");
  }

  function deleteSegment(id) {
    const seg = segments.find(s => s.id === id);
    if (!seg) return;
    const keptCount = segments.filter(s => !s.deleted).length;
    if (keptCount <= 1) {
      toast("You cannot delete all parts. At least one part must remain in the clip.", "bad");
      return;
    }
    seg.deleted = true;
    renderSegments();
    toast(`Deleted ${fmt(seg.start)} – ${fmt(seg.end)}. This part is cut out!`, "ok");
    checkCutSkip(stageVideo ? stageVideo.currentTime : start);
  }

  function restoreSegment(id) {
    const seg = segments.find(s => s.id === id);
    if (!seg) return;
    seg.deleted = false;
    renderSegments();
    toast(`Restored ${fmt(seg.start)} – ${fmt(seg.end)}.`, "ok");
  }

  function checkCutSkip(currTime) {
    if (!isReview || !stageVideo) return currTime;
    const del = segments.find(s => s.deleted && currTime >= s.start - 0.05 && currTime < s.end);
    if (del) {
      const nextKept = segments.find(s => !s.deleted && s.start >= del.end - 0.05);
      if (nextKept) {
        stageVideo.currentTime = nextKept.start;
        return nextKept.start;
      } else {
        const firstKept = segments.find(s => !s.deleted);
        if (firstKept) {
          if (isLoop) {
            stageVideo.currentTime = firstKept.start;
            return firstKept.start;
          } else {
            stageVideo.pause();
            stageVideo.currentTime = firstKept.start;
            return firstKept.start;
          }
        }
      }
    }
    return currTime;
  }

  function setSpeed(sp) {
    currentSpeed = Number(sp) || 1.0;
    if (speedSelect && speedSelect.value !== String(currentSpeed)) speedSelect.value = String(currentSpeed);
    speedPills.forEach(p => p.classList.toggle("on", Number(p.dataset.speed) === currentSpeed));

    if (reverseTimer) {
      cancelAnimationFrame(reverseTimer);
      reverseTimer = null;
    }
    const v = getActiveVideo();
    if (!v) return;

    if (currentSpeed > 0) {
      v.playbackRate = currentSpeed;
      if (v.paused) v.play().catch(() => {});
    } else {
      v.pause();
      const mult = Math.abs(currentSpeed);
      let lastT = performance.now();

      function reverseStep(now) {
        if (currentSpeed >= 0) return;
        const dt = (now - lastT) / 1000;
        lastT = now;
        const curV = getActiveVideo();
        if (curV) {
          let nt = curV.currentTime - (dt * mult);
          if (mode === "source") {
            const del = segments.find(s => s.deleted && nt <= s.end && nt >= s.start);
            if (del) {
              const prevKept = [...segments].reverse().find(s => !s.deleted && s.end <= del.start + 0.05);
              if (prevKept) nt = prevKept.end;
            }
            if (nt <= start) {
              if (isLoop) nt = end;
              else {
                curV.currentTime = start;
                updateVisuals(start);
                return;
              }
            }
          } else {
            const clipDur = (curV.duration && isFinite(curV.duration)) ? curV.duration : Math.max(0.1, end - start);
            if (nt <= 0) nt = clipDur;
          }
          curV.currentTime = nt;
          updateVisuals(mode === "source" ? nt : (start + nt));
        }
        reverseTimer = requestAnimationFrame(reverseStep);
      }
      reverseTimer = requestAnimationFrame(reverseStep);
    }
  }

  speedPills.forEach(p => {
    p.onclick = () => setSpeed(p.dataset.speed);
  });
  if (speedSelect) {
    speedSelect.onchange = () => setSpeed(speedSelect.value);
  }

  const toPct = t => Math.max(0, Math.min(100, ((t - minTime) / span) * 100));
  const fromPct = p => minTime + (Math.max(0, Math.min(100, p)) / 100) * span;

  function renderTicks() {
    if (!ticks) return;
    const effectiveSpanInView = span / zoom;
    let step = 60;
    if (effectiveSpanInView > 1200) step = 300;
    else if (effectiveSpanInView > 600) step = 120;
    else if (effectiveSpanInView > 300) step = 60;
    else if (effectiveSpanInView > 120) step = 30;
    else if (effectiveSpanInView > 60) step = 15;
    else if (effectiveSpanInView > 30) step = 5;
    else if (effectiveSpanInView > 10) step = 2;
    else step = 1;

    let html = "";
    const first = Math.ceil(minTime / step) * step;
    for (let t = first; t <= maxTime; t += step) {
      const p = toPct(t);
      html += `<div class="tl-tick-item" style="left:${p}%">
        <span class="tl-tick-line"></span>
        <span class="tl-tick-time">${fmt(t)}</span>
      </div>`;
    }
    ticks.innerHTML = html;
  }

  function applyZoom(newZoom, anchorClientX) {
    newZoom = Math.max(1.0, Math.min(30.0, Math.round(newZoom * 100) / 100));
    if (!viewport || !track) return;
    const vRect = viewport.getBoundingClientRect();
    const mouseX = (anchorClientX != null ? anchorClientX : (vRect.left + vRect.width / 2)) - vRect.left;
    const oldScroll = viewport.scrollLeft;
    const oldTrackW = track.offsetWidth || vRect.width;
    const timeAtAnchor = minTime + ((oldScroll + mouseX) / oldTrackW) * span;

    zoom = newZoom;
    track.style.width = (zoom * 100) + "%";
    if (zVal) zVal.textContent = Math.round(zoom * 100) + "%";

    const newTrackW = track.offsetWidth || (vRect.width * zoom);
    const newOffset = ((timeAtAnchor - minTime) / span) * newTrackW;
    viewport.scrollLeft = Math.max(0, newOffset - mouseX);

    renderTicks();
    updateVisuals();
  }

  // Ctrl + Wheel to Zoom
  if (viewport) {
    viewport.addEventListener("wheel", e => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.25 : 0.8;
        applyZoom(zoom * factor, e.clientX);
      }
    }, { passive: false });
  }

  if (zIn) zIn.onclick = () => applyZoom(zoom * 1.35);
  if (zOut) zOut.onclick = () => applyZoom(zoom / 1.35);
  if (zFit) {
    zFit.onclick = () => {
      const clipSpan = Math.max(3, end - start);
      const targetZ = Math.max(1.0, Math.min(30.0, (span / clipSpan) * 0.55));
      applyZoom(targetZ, viewport ? viewport.getBoundingClientRect().left + viewport.clientWidth / 2 : null);
      setTimeout(() => {
        if (!viewport || !track) return;
        const centerT = start + clipSpan / 2;
        const centerPos = ((centerT - minTime) / span) * track.offsetWidth;
        viewport.scrollLeft = Math.max(0, centerPos - viewport.clientWidth / 2);
      }, 30);
    };
  }

  function updateVisuals(currTime) {
    const lPct = toPct(start);
    const rPct = toPct(end);

    if (dimL) dimL.style.width = lPct + "%";
    if (dimR) dimR.style.width = (100 - rPct) + "%";

    if (hLeft) hLeft.style.left = lPct + "%";
    if (hRight) hRight.style.left = rPct + "%";

    const dur = Math.max(0, end - start);
    if (durLbl) durLbl.textContent = dur.toFixed(1) + "s";
    if (startLbl) startLbl.textContent = fmt(start);
    if (endLbl) endLbl.textContent = fmt(end);

    if (inStart && inStart !== document.activeElement) inStart.value = start.toFixed(2);
    if (inEnd && inEnd !== document.activeElement) inEnd.value = end.toFixed(2);

    const v = getActiveVideo();
    let ct;
    if (currTime != null) {
      ct = currTime;
    } else if (v) {
      ct = (mode === "source") ? v.currentTime : (start + (v.currentTime || 0));
    } else {
      ct = pointerTime;
    }
    ct = Math.max(minTime, Math.min(maxTime, Math.round(ct * 100) / 100));
    pointerTime = ct;
    if (splitTLbl) splitTLbl.textContent = fmt(ct);
    if (needleBadge) needleBadge.textContent = fmt(ct);
    if (splitBtn) splitBtn.title = "Split clip at " + fmt(ct);
    syncPlayBtn();

    if (pointer) {
      pointer.style.left = toPct(ct) + "%";
    }

    if (progFill) {
      const progRelPct = dur > 0 ? Math.max(0, Math.min(100, ((ct - start) / dur) * 100)) : 0;
      progFill.style.left = lPct + "%";
      progFill.style.width = (((rPct - lPct) * progRelPct) / 100) + "%";
    }

    if (stageBadge) {
      if (mode === "source") {
        const cutCount = segments.filter(s => s.deleted).length;
        const keptDur = segments.filter(s => !s.deleted).reduce((acc, s) => acc + (s.end - s.start), 0);
        stageBadge.className = "badge ok";
        stageBadge.textContent = `Live Preview: ${fmt(start)} – ${fmt(end)} (${keptDur.toFixed(1)}s${cutCount > 0 ? `, ${cutCount} cut` : ""})`;
      } else {
        stageBadge.className = `badge ${scoreCls(c.score)}`;
        stageBadge.textContent = "Rendered (9:16)";
      }
    }
    renderSegments();
  }

  function setMode(newMode) {
    if (newMode === mode) return;
    if (newMode === "rendered" && !stageVideo) return;
    const prevV = getActiveVideo();
    if (prevV) prevV.pause();

    mode = newMode;
    isReview = (mode === "source");
    if (mode === "rendered") {
      if (sourceVideo) sourceVideo.style.display = "none";
      if (stageVideo) stageVideo.style.display = "block";
      if (stageToggleBtn) {
        stageToggleBtn.innerHTML = `${ic("play")}Live Source Preview`;
        stageToggleBtn.title = "Switch to full video source for live scrubbing & trimming";
      }
    } else {
      if (stageVideo) stageVideo.style.display = "none";
      if (sourceVideo) sourceVideo.style.display = "block";
      if (stageToggleBtn) {
        stageToggleBtn.innerHTML = `${ic("film")}Rendered (9:16)`;
        stageToggleBtn.title = "View rendered 9:16 clip";
      }
    }
    seekLive(pointerTime);
    syncPlayBtn();
    updateVisuals(pointerTime);
  }

  function switchToReview(seekTime, autoplay = false) {
    setMode("source");
    if (seekTime != null) seekLive(seekTime);
    if (autoplay) {
      const v = getActiveVideo();
      if (v) {
        if (currentSpeed > 0) {
          v.playbackRate = currentSpeed;
          v.play().catch(() => {});
        } else {
          setSpeed(currentSpeed);
        }
      }
    }
  }

  function switchToRendered() {
    setMode("rendered");
  }

  if (stageToggleBtn) {
    stageToggleBtn.onclick = () => {
      if (mode === "source") setMode("rendered");
      else setMode("source");
    };
  }

  let seekRaf = null;
  let targetSeekT = null;

  function seekLive(t) {
    pointerTime = Math.max(minTime, Math.min(maxTime, Math.round(t * 100) / 100));
    targetSeekT = pointerTime;

    const v = getActiveVideo();
    if (v) {
      if (!seekRaf) {
        seekRaf = requestAnimationFrame(() => {
          seekRaf = null;
          if (targetSeekT != null && v) {
            if (mode === "source") {
              v.currentTime = targetSeekT;
            } else {
              const clipDur = (v.duration && isFinite(v.duration)) ? v.duration : Math.max(0.1, end - start);
              v.currentTime = Math.max(0, Math.min(clipDur, targetSeekT - start));
            }
          }
        });
      }
    }
    syncPlayBtn();
    updateVisuals(pointerTime);
  }

  function seekVideoTo(t) {
    seekLive(t);
  }

  function setTimes(newStart, newEnd, seekVideo = true) {
    newStart = Math.round(newStart * 100) / 100;
    newEnd = Math.round(newEnd * 100) / 100;
    if (newEnd - newStart < 3) {
      if (newStart !== start) newStart = Math.max(minTime, newEnd - 3);
      else newEnd = Math.min(maxTime, newStart + 3);
    }
    if (newEnd - newStart > 180) {
      if (newStart !== start) newStart = newEnd - 180;
      else newEnd = newStart + 180;
    }
    start = Math.max(minTime, Math.min(maxTime - 3, newStart));
    end = Math.min(maxTime, Math.max(start + 3, newEnd));

    if (segments.length === 1) {
      segments[0].start = start;
      segments[0].end = end;
    } else if (segments.length > 1) {
      segments[0].start = start;
      segments[segments.length - 1].end = end;
    }

    updateVisuals(start);

    if (seekVideo) {
      if (stageVideo && mode !== "source") {
        setMode("source");
      }
      seekLive(start);
    }
  }

  const allVideos = [sourceVideo, stageVideo].filter(Boolean);
  allVideos.forEach(v => {
    v.ontimeupdate = () => {
      if (v !== getActiveVideo()) return;
      if (mode === "source") {
        let ct = v.currentTime;
        ct = checkCutSkip(ct);
        if (ct >= end) {
          const firstKept = segments.find(s => !s.deleted);
          const tStart = firstKept ? firstKept.start : start;
          if (isLoop) {
            v.currentTime = tStart;
          } else {
            v.pause();
            v.currentTime = tStart;
          }
        } else if (ct < start - 0.5) {
          const firstKept = segments.find(s => !s.deleted);
          v.currentTime = firstKept ? firstKept.start : start;
        }
        updateVisuals(v.currentTime);
      } else {
        const clipDur = (v.duration && isFinite(v.duration)) ? v.duration : Math.max(0.1, end - start);
        if (v.currentTime >= clipDur - 0.02 || v.ended) {
          if (isLoop) {
            v.currentTime = 0;
            v.play().catch(() => {});
          } else {
            v.pause();
          }
        }
        const currentT = start + Math.max(0, Math.min(clipDur, v.currentTime));
        updateVisuals(currentT);
      }
    };
    v.addEventListener("play", syncPlayBtn);
    v.addEventListener("pause", syncPlayBtn);
    v.addEventListener("ended", syncPlayBtn);
  });

  let initSegments = null;
  let didDragMove = false;
  function onPointerDown(e, type) {
    dragType = type;
    didDragMove = false;
    startX = e.clientX;
    initStart = start;
    initEnd = end;
    const v = getActiveVideo();
    if (v) v.pause();
    initSegments = segments.map(s => ({ ...s }));
    if (e.target.setPointerCapture) {
      try { e.target.setPointerCapture(e.pointerId); } catch {}
    }
    if (stageVideo && mode !== "source" && (type === "left" || type === "right" || type === "range")) {
      setMode("source");
    }
    e.stopPropagation();
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!dragType) return;
    if (Math.abs(e.clientX - startX) > 2) didDragMove = true;
    const rect = track.getBoundingClientRect();
    const dx = e.clientX - startX;
    const dt = (dx / rect.width) * span;

    if (dragType === "left") {
      let ns = Math.max(minTime, Math.min(initEnd - 3, initStart + dt));
      if (initEnd - ns > 180) ns = initEnd - 180;
      setTimes(ns, initEnd, false);
      if (stageVideo && mode !== "source") setMode("source");
      seekLive(start);
    } else if (dragType === "right") {
      let ne = Math.min(maxTime, Math.max(initStart + 3, initEnd + dt));
      if (ne - initStart > 180) ne = initStart + 180;
      setTimes(initStart, ne, false);
      if (stageVideo && mode !== "source") setMode("source");
      seekLive(end);
    } else if (dragType === "range") {
      const dur = initEnd - initStart;
      let ns = initStart + dt;
      if (ns < minTime) ns = minTime;
      if (ns + dur > maxTime) ns = maxTime - dur;
      const actualDt = ns - initStart;
      setTimes(ns, ns + dur, false);
      if (initSegments) {
        segments.forEach((s, idx) => {
          if (initSegments[idx]) {
            s.start = Math.round((initSegments[idx].start + actualDt) * 100) / 100;
            s.end = Math.round((initSegments[idx].end + actualDt) * 100) / 100;
          }
        });
        renderSegments();
      }
      if (stageVideo && mode !== "source") setMode("source");
      seekLive(ns);
      syncPlayBtn();
      updateVisuals(ns);
    } else if (dragType === "pointer") {
      const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const t = Math.max(minTime, Math.min(maxTime, fromPct(pct)));
      if (stageVideo && mode !== "source" && (t < start - 0.2 || t > end + 0.2)) {
        setMode("source");
      }
      seekLive(t);
    }

    if (viewport) {
      const vRect = viewport.getBoundingClientRect();
      if (e.clientX < vRect.left + 35) {
        viewport.scrollLeft -= 8;
      } else if (e.clientX > vRect.right - 35) {
        viewport.scrollLeft += 8;
      }
    }
  }

  function onPointerUp(e) {
    if (dragType) {
      if (e.target && e.target.releasePointerCapture) {
        try { e.target.releasePointerCapture(e.pointerId); } catch {}
      }
      const wasType = dragType;
      dragType = null;
      const v = getActiveVideo();
      if (v) {
        let finalT = pointerTime;
        if (wasType === "left") finalT = start;
        else if (wasType === "right") finalT = end;
        else if (wasType === "range") finalT = start;

        if (mode === "source") {
          v.currentTime = finalT;
        } else {
          const clipDur = (v.duration && isFinite(v.duration)) ? v.duration : Math.max(0.1, end - start);
          v.currentTime = Math.max(0, Math.min(clipDur, finalT - start));
        }
        v.pause();
      }
      syncPlayBtn();
      setTimeout(() => { didDragMove = false; }, 60);
    }
  }

  hLeft?.addEventListener("pointerdown", e => onPointerDown(e, "left"));
  hRight?.addEventListener("pointerdown", e => onPointerDown(e, "right"));
  pointerCap?.addEventListener("pointerdown", e => onPointerDown(e, "pointer"));
  pointer?.addEventListener("pointerdown", e => onPointerDown(e, "pointer"));
  clipsTrack?.addEventListener("pointerdown", e => {
    if (e.target.closest("[data-act-del], [data-act-res]")) return;
    onPointerDown(e, "range");
  });
  ticks?.addEventListener("pointerdown", e => {
    onPointerDown(e, "pointer");
    const rect = track.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    const t = Math.max(minTime, Math.min(maxTime, fromPct(pct)));
    if (stageVideo && mode !== "source" && (t < start - 0.2 || t > end + 0.2)) {
      setMode("source");
    }
    seekLive(t);
  });

  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);

  const onKeyDown = e => {
    if (e.code === "Space" || e.key === " ") {
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
      const dlg = $("#clipdlg");
      if (dlg && dlg.open) {
        e.preventDefault();
        togglePlay();
      }
    }
  };
  window.addEventListener("keydown", onKeyDown);

  const cleanup = () => {
    if (seekRaf) { cancelAnimationFrame(seekRaf); seekRaf = null; }
    if (reverseTimer) { cancelAnimationFrame(reverseTimer); reverseTimer = null; }
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
    window.removeEventListener("keydown", onKeyDown);
    allVideos.forEach(v => {
      v.pause();
      v.removeEventListener("play", syncPlayBtn);
      v.removeEventListener("pause", syncPlayBtn);
      v.removeEventListener("ended", syncPlayBtn);
    });
    $("#clipdlg")?.removeEventListener("close", cleanup);
  };
  $("#clipdlg")?.addEventListener("close", cleanup);

  track?.addEventListener("click", e => {
    if (didDragMove || e.target === hLeft || e.target === hRight || e.target.closest(".tl-vcard-del, .tl-vcard-res") || dragType) return;
    const rect = track.getBoundingClientRect();
    const clickPct = ((e.clientX - rect.left) / rect.width) * 100;
    const clickTime = Math.round(fromPct(clickPct) * 100) / 100;
    if (stageVideo && mode !== "source" && (clickTime < start - 0.2 || clickTime > end + 0.2)) {
      setMode("source");
    }
    seekLive(clickTime);
  });

  if (clipsTrack) {
    clipsTrack.onclick = e => {
      const delBtn = e.target.closest("[data-act-del]");
      if (delBtn) {
        e.stopPropagation();
        return deleteSegment(Number(delBtn.dataset.actDel));
      }
      const resBtn = e.target.closest("[data-act-res]");
      if (resBtn) {
        e.stopPropagation();
        return restoreSegment(Number(resBtn.dataset.actRes));
      }
    };
  }

  box.querySelectorAll("[data-step-s]").forEach(btn => {
    btn.onclick = () => {
      const step = Number(btn.dataset.stepS);
      setTimes(start + step, end, true);
    };
  });
  box.querySelectorAll("[data-step-e]").forEach(btn => {
    btn.onclick = () => {
      const step = Number(btn.dataset.stepE);
      setTimes(start, end + step, true);
    };
  });

  if (inStart) {
    inStart.onchange = () => {
      setTimes(Number(inStart.value), end, true);
    };
  }
  if (inEnd) {
    inEnd.onchange = () => {
      setTimes(start, Number(inEnd.value), true);
    };
  }

  if (splitBtn) {
    splitBtn.onclick = () => {
      const ct = pointerTime;
      splitAt(ct);
    };
  }
  if (resetCutsBtn) {
    resetCutsBtn.onclick = () => {
      segments = [{ id: nextSegId++, start: start, end: end, deleted: false }];
      renderSegments();
      updateVisuals(pointerTime);
      toast("All cuts reset. Full range restored.", "ok");
    };
  }
  if (segListWrap) {
    segListWrap.onclick = e => {
      const delBtn = e.target.closest("[data-act-del]");
      if (delBtn) return deleteSegment(Number(delBtn.dataset.actDel));
      const resBtn = e.target.closest("[data-act-res]");
      if (resBtn) return restoreSegment(Number(resBtn.dataset.actRes));
      const chip = e.target.closest(".tl-seg-item, .tl-seg-chip");
      if (chip) {
        const seg = segments.find(s => s.id === Number(chip.dataset.segId));
        if (seg) {
          setMode("source");
          seekLive(seg.start);
          const v = getActiveVideo();
          if (v) v.play().catch(() => {});
        }
      }
    };
  }

  renderTicks();
  renderSegments();
  updateVisuals(start);

  // If video is long relative to clip, automatically provide a comfortable zoom & scroll
  if (span / (end - start) > 8) {
    const targetZ = Math.max(1.0, Math.min(10.0, (span / (end - start)) * 0.45));
    applyZoom(targetZ, null);
    setTimeout(() => {
      if (!viewport || !track) return;
      const centerT = start + (end - start) / 2;
      const centerPos = ((centerT - minTime) / span) * track.offsetWidth;
      viewport.scrollLeft = Math.max(0, centerPos - viewport.clientWidth / 2);
    }, 40);
  }
}
function initDialogDrag() {
  const bar = $("#dlg_drag_bar");
  const dlg = $("#clipdlg");
  if (!bar || !dlg) return;
  let isDragging = false;
  let startX = 0, startY = 0;
  let initialLeft = 0, initialTop = 0;

  bar.onpointerdown = e => {
    if (e.target.closest("button, a, input")) return;
    isDragging = true;
    const rect = dlg.getBoundingClientRect();
    startX = e.clientX;
    startY = e.clientY;
    initialLeft = rect.left;
    initialTop = rect.top;
    dlg.style.position = "fixed";
    dlg.style.margin = "0";
    dlg.style.left = initialLeft + "px";
    dlg.style.top = initialTop + "px";
    if (bar.setPointerCapture) {
      try { bar.setPointerCapture(e.pointerId); } catch {}
    }
    e.preventDefault();
  };

  bar.onpointermove = e => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const maxLeft = Math.max(0, window.innerWidth - dlg.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - dlg.offsetHeight);
    const newLeft = Math.max(0, Math.min(maxLeft, initialLeft + dx));
    const newTop = Math.max(0, Math.min(maxTop, initialTop + dy));
    dlg.style.left = newLeft + "px";
    dlg.style.top = newTop + "px";
  };

  const stopDrag = e => {
    if (isDragging) {
      isDragging = false;
      if (bar.releasePointerCapture) {
        try { bar.releasePointerCapture(e.pointerId); } catch {}
      }
    }
  };
  bar.onpointerup = stopDrag;
  bar.onpointercancel = stopDrag;
}

async function tick() {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(S.syncV || ""));
    const fresh = !!got.jobs, stale = Date.now() - (S.ovAt || 0) > 20000;
    S.syncV = got.v;
    if (!fresh) {                                   // nothing of ours changed on the server
      if (S.view === "overview" && stale) { S.overview = await api("/api/overview"); S.ovAt = Date.now(); render(); }
      if (S.view === "channels" && Date.now() - (S.chAt || 0) > 20000) await loadChannels();
      return;
    }
    const {jobs, creators, accounts} = got;
    // a server from before multi-channel support sends only `channel`: show it as that platform's channel
    creators.forEach(c => { if (!c.channels) { const u = c.channel || "", k = /youtu/i.test(u) ? "youtube" : /twitch/i.test(u) ? "twitch" : /kick/i.test(u) ? "kick" : ""; c.channels = k ? {[k]: u} : {}; } });
    S.jobs = jobs; S.creators = creators; S.accounts = accounts;
    if (got.projected) S.projected = got.projected;
    if (got.groups) S.groups = got.groups;
    if (got.ai) S.status.ai = got.ai;
    if (got.unread != null) S.status.unread = got.unread;
    if (S.view === "overview") { S.overview = await api("/api/overview"); S.ovAt = Date.now(); }
    if (S.view === "channels") { S.chan = await api("/api/channels"); S.groups = S.chan.groups; S.chAt = Date.now(); }
    if (creatorId() && !creator()) return go("overview");
    render();
  } catch {}
}
// Back on the tab (or window): ask straight away instead of waiting out the slow background timer, and put a
// live player that fell behind while hidden back at the live edge.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  tick();
  if (hiddenAt && Date.now() - hiddenAt > 60000) {   // away a while: jump back to the live moment
    const pl = $("#stream .player"), f = pl?.querySelector("iframe");
    if (f) { const src = f.src; f.src = "about:blank"; requestAnimationFrame(() => { f.src = src; }); }
  }
  hiddenAt = 0;
});
window.addEventListener("focus", () => { if (!document.hidden) tick(); });
function loop() {
  const active = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => c.status === "queued" || c.status === "rendering"));
  // quick while something is being made, relaxed otherwise, and slow when the tab is in the background
  const waiting = S.creators.some(c => (c.channels && Object.keys(c.channels).length && !c.profile?.pic) || c.live_job && !jobOf(c.live_job));
  setTimeout(async () => { await tick(); loop(); }, document.hidden ? 20000 : waiting ? 1000 : active ? 2000 : 4000);
}

    }
    if (a === "cancelclip") {
      if (!await ask("Cancel this clip?", "PeakCut stops making it. A new clip is dropped; a clip you were re-making goes back to how it was.", "Stop it", true, "Keep going")) return;
      try { await send(`/api/jobs/${d.j}/clips/${encodeURIComponent(d.c)}/cancel`); toast("Cancelling…"); }
      catch (e) { toast(e.message, "bad"); }
      return tick();
    }
    if (a === "delclip") {
      if (!await ask("Delete this clip?", "The clip is removed for good. The video and its other clips stay.", "Delete clip", true)) return;
      await api(`/api/jobs/${d.j}/clips/${encodeURIComponent(d.c)}`, {method:"DELETE"});
      const j = jobOf(d.j); if (j) j.clips = j.clips.filter(c => c.id !== d.c);
      render(); toast("Clip deleted", "ok"); return tick();
    }
    if (a === "dlall") return zipDownload((jobOf(d.j)?.clips || []).filter(c => c.status === "done").map(c => d.j + "." + c.id));
    if (a === "seldl") return zipDownload(selClips());
    if (a === "selclear") { sel().clear(); return render(); }
    if (a === "selall") {
      const cid = creatorId();
      (cid ? S.jobs.filter(j => j.creator === cid) : S.jobs).forEach(j => { if (!["queued", "running", "live"].includes(j.status)) { sel().add("j:" + j.id); j.clips.forEach(c => sel().delete(`c:${j.id}:${c.id}`)); } });
      return render();
    }
    if (a === "seldel") {
      const {jobsSel, clipsSel} = selParts();
      const what = [jobsSel.length ? (jobsSel.length === 1 ? "1 video with all its clips" : `${jobsSel.length} videos with all their clips`) : "", clipsSel.length ? `${clipsSel.length} clip${clipsSel.length === 1 ? "" : "s"}` : ""].filter(Boolean).join(" and ");
      if (!await ask("Delete what you selected?", `This removes ${what} for good. It cannot be undone.`, "Delete", true)) return;
      const r = await send("/api/bulk/delete", {videos: jobsSel, clips: clipsSel});
      sel().clear(); await tick(); render();
      return toast(`Deleted ${r.videos} video${r.videos === 1 ? "" : "s"} and ${r.clips} clip${r.clips === 1 ? "" : "s"}` + (r.skipped ? `. ${r.skipped} still being made were left alone.` : ""), "ok");
    }
    if (a === "delcreator") {
      const c = creator(); if (!c) return;
      const n = S.jobs.filter(j => j.creator === c.id).length;
      if (!await askTyped(`Delete ${c.name}?`, `This removes the creator, their settings${n ? `, and their ${n} video${n === 1 ? "" : "s"} with all the clips` : ""} for good. It cannot be undone.`, c.name, "Delete creator")) return;
      await api(`/api/creators/${encodeURIComponent(c.id)}`, {method:"DELETE"});
      S.creators = S.creators.filter(x => x.id !== c.id); S.jobs = S.jobs.filter(j => j.creator !== c.id);
      go("overview"); toast("Creator deleted", "ok"); return tick();
    }
    if (a === "delaccount") {
      const me = S.status.user;
      const typed = await askTyped("Delete your account?", `This removes your account and everything in it for good: creators, recordings, videos, clips, connected accounts and history.`, me.email, "Delete my account");
      if (!typed) return;
      await send("/api/account/delete", {confirm: typed});
      location.href = "/"; return;
    }
    if (a === "deljob") {
      if (!await ask("Delete this video?", "The video and all of its clips are permanently deleted. This cannot be undone.", "Delete", true)) return;
      await api(`/api/jobs/${d.j}`, {method:"DELETE"}); toast("Deleted"); return tick();
    }
    if (a === "chadd") {
      const k = d.p, v = $("#chan_" + k)?.value.trim();
      if (!v) { $("#chan_" + k)?.focus(); return toast(`Paste their ${PLAT[k].name} channel link.`, "bad"); }
      const full = /^https?:\/\//.test(v) ? v : "https://" + v;
      return saveChannels({...creator().channels, [k]: full});
    }
    if (a === "chdel") { const chs = {...creator().channels}; delete chs[d.p]; return saveChannels(chs); }
    if (a === "spick") { S.spick = {...S.spick, [creatorId()]: d.p}; return drawStream(); }
    if (a === "chmain") return saveChannels(creator().channels, creator().channels[d.p]);
    if (a === "golive") {
      if (!creator().channel) { setTab("setup"); return toast("Connect one of their channels first, then press Start recording.", "bad"); }
      b.disabled = true; const was = b.innerHTML; b.innerHTML = `<span class="rdot"></span>Starting…`;
      try {
        // The creator is fixed before asking: starting can take a few seconds, and the person may open another
        // creator meanwhile. The recording must stay with the one whose button was pressed.
        const cid0 = creatorId();
        const j = await send(`/api/creators/${cid0}/live`, d.url ? {channel: d.url} : {});
        if (j?.id) { const c = S.creators.find(x => x.id === cid0); if (c) c.live_job = j.id; if (!jobOf(j.id)) S.jobs.unshift(j); render(); }
        const still = creatorId() === cid0;
        toast(still ? "Recording started. Clips appear below as they're made." : `Recording started for ${S.creators.find(x => x.id === cid0)?.name || "that creator"}.`, "ok");
        if (still) setTab("clips");
      } catch (e) { b.disabled = false; b.innerHTML = was; throw e; }
      return tick();
    }
    if (a === "stoplive") {
      if (!await ask("Stop recording?", "Clips already made are kept. The rest of the buffer is cleared.", "Stop recording", true)) return;
      const j = jobOf(d.j); if (j) { j.status = "done"; j.stage = "Stopped by you"; }
      S.creators.forEach(c => { if (c.live_job === d.j) c.live_job = null; }); render();
      toast("Recording stopped. Clips already made are kept.", "ok");
      api(`/api/live/${d.j}/stop`, {method:"POST"}).catch(e => toast(e.message, "bad")).finally(tick); return;
    }
    if (a === "clipnow") { await send(`/api/live/${d.j}/clip`, {seconds:Number(d.s)}); return toast(`Clipping the last ${d.s} seconds…`, "ok"); }
    if (a === "resendverify") {
      b.disabled = true;
      try { const r = await send("/api/auth/resend-verification"); if (r.verified) { S.status = await api("/api/status"); drawShell(); return toast("Your email is already confirmed.", "ok"); }
        toast(r.mail_ready ? `New link sent to ${S.status.user.email}. Check your spam folder too.` : "Email isn't set up on this server yet, so the link was written to the server log.", r.mail_ready ? "ok" : "bad"); }
      catch (e) { toast(e.message, "bad"); }
      b.disabled = false; return;
    }
    if (a === "tour") return startTour();
    if (a === "settab") { e.preventDefault(); S.stab = d.k; remember("settings", d.k); return drawSettings(); }
    if (a === "updhow") return updateHow();
    if (a === "updlater") { try { localStorage.setItem("peakcut_update_seen", S.status.update?.latest || ""); } catch {} return drawShell(); }
    if (a === "storopen") { await send("/api/storage/open"); return; }
    if (a === "storchange") { S.storOpen = !S.storOpen; S.storNew = ""; return drawSettings(); }
    if (a === "storpick") {
      b.disabled = true;
      try { const r = await send("/api/storage/pick"); if (r.path) { S.storNew = r.path; $("#stor_new").value = r.path; } } finally { b.disabled = false; }
      return;
    }
    if (a === "storsave") {
      const s = await send("/api/storage", {path: $("#stor_new").value, move: $("#stor_move").checked}, "PUT");
      S.storOpen = false; toast("Saved. Close PeakCut and start it again to switch to the new folder.", "ok"); return drawSettings();
    }
    if (a === "storcancel") { await send("/api/storage", {cancel: true}, "PUT"); toast("Kept the current folder", "ok"); return drawSettings(); }
    if (a === "appsetup") { S.setupOpen = d.p && S.setupOpen !== d.p ? d.p : ""; return drawSettings(); }
    if (a === "copytext") { await navigator.clipboard.writeText(d.t); return toast("Copied", "ok"); }
    if (a === "ytcookies") {
      await send("/api/youtube-cookies", d.remove ? {remove: true} : {text: $("#ytc").value}, "PUT");
      S.setupOpen = ""; toast(d.remove ? "YouTube cookies removed." : "Saved. YouTube links will use them now.", "ok"); return drawSettings();
    }
    if (a === "appsave") {
      await send("/api/apps", {platform: d.p, client_id: $("#app_id").value, client_secret: $("#app_secret").value}, "PUT");
      S.setupOpen = ""; S.status = await api("/api/status"); toast("Saved. People can connect now.", "ok"); return drawSettings();
    }
    if (a === "bell") return openBell();
    if (a === "feedback") return openFeedback("bug");
    if (a === "report") return openFeedback("bug", d.ctx);
    if (a === "acctmenu") return openAcct();
    if (a === "bellread") { await markRead(); return openBell().then(openBell); }
    if (a === "ntgo") { closePops(); const l = d.link || ""; if (l.startsWith("/app")) { const [v, tab] = fromPath(l); return go(v, tab); } if (l.startsWith("/")) location.href = l; return; }
    if (a === "csave") return void await saveCreator();
    if (a === "cdiscard") { drawCreatorForm(); return toast("Changes discarded"); }
    if (a === "pause") { await send("/api/settings", {paused:!S.overview.paused}, "PUT"); return loadOverview(); }
    if (a === "schsave") { await send("/api/settings", {schedule_on:$("#schon").checked, schedule_times:$("#schtimes").value}, "PUT"); toast("Default times saved", "ok"); await loadOverview(); return refreshPosting(); }
    if (a === "resched") { const r = await send("/api/posts/reschedule", {}); toast(r.moved ? `Moved ${r.moved} waiting clip${r.moved > 1 ? "s" : ""} onto the schedule` : "No waiting clips to move", "ok"); return refreshPosting(); }
    if (a === "pretryall") { const r = await send("/api/posts/retry-failed", {}); toast(`Uploading ${r.retried} clip${r.retried === 1 ? "" : "s"} now`, "ok"); return loadOverview(); }
    if (a === "pdismiss") { await api(`/api/posts/${d.id}/dismiss`, {method:"POST"}); return loadOverview(); }
    if (a === "qvideo") {
      const j = jobOf(d.j), pick = await pickAccounts("Queue all clips", "Choose where these clips go. Each takes the next free upload time.", (S.creators.find(c => c.id === j?.creator)?.accounts || []).filter(id => S.accounts.some(a => a.id === id)));
      if (!pick) return;
      const r = await send("/api/posts/queue-video", {job:d.j, accounts:pick}); toast(`${r.queued} clip${r.queued > 1 ? "s" : ""} added to the queue`, "ok"); return tick();
    }
    if (a === "pcancel" || a === "pretry") { await api(`/api/posts/${d.id}/${a === "pcancel" ? "cancel" : "retry"}`, {method:"POST"}); return refreshPosting(); }
    if (a === "ssave") { await saveSettings(); toast("Saved", "ok"); return drawSettings(); }
    if (a === "plansave") {
      const p = {}; $$("#sform [data-plan]").forEach(i => { (p[i.dataset.plan] ??= {})[i.dataset.f] = Number(i.value); });
      await send("/api/settings", {plans:p}, "PUT"); S.status = await api("/api/status"); toast("Plans saved", "ok"); return drawSettings();
    }
    if (a === "testalert") { await saveSettings(); await api("/api/alerts/test", {method:"POST"}); return toast("Test message sent. Check your phone.", "ok"); }
    if (a === "accremove") {
      if (!await ask("Disconnect this account?", "Posts still waiting for it will fail.", "Disconnect", true)) return;
      await api(`/api/accounts/${d.id}`, {method:"DELETE"}); await tick(); return drawSettings();
    }
    if (a === "remake") {
      const body = {}; $$("#clipdlg [data-f]").forEach(i => {
        body[i.dataset.f] = i.type === "checkbox" ? i.checked : i.type === "number" ? Number(i.value) : i.value;
      });
      await send(`/api/jobs/${D.jid}/clips/${D.cid}/render`, body); toast("Re-making the clip…", "ok"); return tick();
    }
    if (a === "writetext") {
      b.disabled = true; const was = b.textContent; b.textContent = "Writing…";
      try {
        const t = await send(`/api/jobs/${D.jid}/clips/${D.cid}/write`, {});
        const f = k => $(`#clipdlg [data-f="${k}"]`);
        f("title").value = t.title; f("description").value = t.description; f("hashtags").value = (t.hashtags || []).join(" ");
        return toast("New post text written. Read it over: it is saved when you post.", "ok");
      } finally { b.disabled = false; b.textContent = was; }
    }
    if (a === "postnow" || a === "postqueue") {
      const accs = $$("#clipdlg [data-pacc]:checked").map(i => i.value);
      if (!accs.length) return toast("Tick at least one account first.", "bad");
      if (a === "postnow" && !await ask("Post now?", `This clip goes to ${accs.length} account${accs.length > 1 ? "s" : ""} straight away.`, "Post now")) return;
      await send(`/api/jobs/${D.jid}/clips/${D.cid}/text`, postText(), "PUT");   // the text as it is in the boxes now
      await send("/api/posts", {job:D.jid, clip:D.cid, accounts:accs, now:a === "postnow"});
      toast(a === "postnow" ? "Posting now" : "Added to the queue", "ok"); return tick();
    }
  } catch (err) { b.disabled = false; toast(err.message, "bad"); }
});

$("#collapseBtn").innerHTML = ic("sidebar"); $("#menuBtn").innerHTML = ic("menu");
try { if (localStorage.getItem("mini")) $("#app").classList.add("mini"); } catch {}
$("#main").addEventListener("scroll", () => $(".topbar").classList.toggle("stuck", $("#main").scrollTop > 4), {passive:true});
(async () => {
  try { S.status = await api("/api/status"); } catch {}
  const q = new URLSearchParams(location.search);
  if (q.get("connected") || q.get("connect_error")) {
    const ok = q.get("connected"), err = q.get("connect_error"), nm = q.get("name");
    history.replaceState(null, "", location.pathname);
    setTimeout(() => ok ? toast(`${nm || ok} is connected. Pick it in a creator's Setup to post there.`, "ok") : toast(err, "bad"), 300);
  }
  if (q.get("verified")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast("Email confirmed. You're ready to clip.", "ok"), 300); }
  if (q.get("verify_error")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast(q.get("verify_error"), "bad"), 300); }
  if (location.pathname.startsWith("/app/")) { const [v, tab] = fromPath(location.pathname); S.view = v; S.ctab = tab; }  // the address decides, before anything loads
  await tick();
  { const [v, tab] = location.pathname.startsWith("/app/") ? fromPath(location.pathname) : ["overview", "clips"]; go(v, tab, true); remember(S.view, S.ctab, "replace"); }
  try {  // a link pasted on the home page before signing up
    const link = sessionStorage.getItem("peakcut_link");
    if (link) { sessionStorage.removeItem("peakcut_link"); go("overview"); $("#url").value = link; onLink($("#url")); $("#url").focus(); toast("Your link is ready. Press Make clips.", "ok"); }
  } catch {}
  loop();
  if (S.status.tour && !$("#formdlg").open) setTimeout(startTour, 500);   // once, the first time someone signs in
  checkNew(true);
  setInterval(async () => { try { S.status = await api("/api/status"); drawShell(); if (S.view === "overview") drawOverview(); checkNew(); } catch {} }, 15000);
})();
</script>
</body>
</html>
